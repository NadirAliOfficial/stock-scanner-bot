# Stock Scanner — Scoring Rules
# Range Market Mode

rules:
  # ── Support ─────────────────────────────────────────────────────────────────
  - field: near_support
    op: eq
    value: true
    points: 6

  - field: support_distance
    op: lte
    value: 0.02
    points: 4

  # ── Resistance ───────────────────────────────────────────────────────────────
  - field: near_resistance
    op: eq
    value: true
    points: -6

  - field: resistance_distance
    op: lte
    value: 0.02
    points: -3

  # ── MA200 ────────────────────────────────────────────────────────────────────
  - field: price_above_ma200
    op: eq
    value: true
    points: 2

  - field: ma200_slope
    op: eq
    value: "UP"
    points: 2

  - field: ma200_slope
    op: eq
    value: "DOWN"
    points: -3

  - field: weeks_above_ma200
    op: gte
    value: 20
    points: 1

  # ── Amplitude ────────────────────────────────────────────────────────────────
  - field: amplitude_valid
    op: eq
    value: true
    points: 1

  - field: amplitude
    op: gte
    value: 0.10
    points: 2

  - field: amplitude
    op: lt
    value: 0.05
    points: 3

  # ── RSI ──────────────────────────────────────────────────────────────────────
  - field: rsi14
    op: lt
    value: 35
    points: 3

  - field: rsi14
    op: gt
    value: 70
    points: -3

  # ── 52-week high distance ────────────────────────────────────────────────────
  - field: dist_52w_high
    op: gt
    value: -0.10
    points: -2

  # ── Confirmation signals ─────────────────────────────────────────────────────
  - field: volume_confirmed
    op: eq
    value: true
    points: 2

  - field: volume_confirmed
    op: eq
    value: false
    points: -3

  - field: rebound_pattern
    op: eq
    value: true
    points: 8

  - field: two_strong_green
    op: eq
    value: true
    points: 3

  # ── Flags ────────────────────────────────────────────────────────────────────
  - field: liquidity_flag
    op: eq
    value: true
    points: 1

  - field: volatility_flag
    op: eq
    value: true
    points: -2

comment_rules:
  - contains: "No confirmation signal"
    points: -4
  - contains: "Resistance too close"
    points: -3
  - contains: "Below MA200"
    points: -3
  - contains: "MA200 not trending up"
    points: -3
  - contains: "Low liquidity"
    points: -5
