# Market Regime Bot — Configuration
# Adjust thresholds here without touching any code.
# Priority order: defensive → bull → range → fallback_mode

ibkr:
  host: 127.0.0.1
  port: 4002
  client_id: 4

indicators:
  spy_ticker: SPY
  qqq_ticker: QQQ
  vix_ticker: VIX
  lookback_days: 300
  spy_ma_period: 200
  qqq_ma_period: 200

regimes:
  defensive:
    # Triggers if VIX is at or above this level (overrides everything)
    vix_min: 25.0

  bull:
    # All three conditions must be true simultaneously
    spy_above_ma: true
    qqq_above_ma: true
    vix_max: 20.0

  range:
    # Explicitly detected when VIX is between bull and defensive thresholds
    vix_min: 20.0
    vix_max: 25.0

# Used if none of the three regimes above are explicitly matched
fallback_mode: range
