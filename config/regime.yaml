# Market Regime Bot — Configuration
# Adjust thresholds here without touching any code.
# Priority order: defensive -> bull -> range -> fallback_mode

ibkr:
  host: 127.0.0.1
  port: 4002
  client_id: 4

indicators:
  spy_ticker: SPY
  qqq_ticker: QQQ
  vix_ticker: VIX
  rsp_ticker: RSP        # Equal-weight S&P 500 ETF — used for market breadth
  lookback_days: 300
  spy_ma_period: 200
  qqq_ma_period: 200
  spy_atr_period: 14     # ATR period for SPY volatility
  rsp_ma_period: 50      # MA period for RSP breadth signal

regimes:
  defensive:
    # OR logic — either condition alone triggers defensive
    vix_min: 25.0          # VIX spike
    atr_pct_min: 2.5       # High ATR% (unstable volatility environment)

  bull:
    # AND logic — all conditions must pass simultaneously
    spy_above_ma: true            # SPY above 200-day MA
    qqq_above_ma: true            # QQQ above 200-day MA
    vix_max: 20.0                 # Low fear environment
    atr_pct_max: 2.0              # Low volatility confirms stability
    breadth_above_ma: true        # RSP above MA50 (broad market participation)
    spy_ma_distance_min: 1.5      # SPY at least 1.5% above MA200 (trend strength)

  range:
    # Explicitly detected when VIX is between bull and defensive thresholds
    vix_min: 20.0
    vix_max: 25.0

# Used when no regime explicitly matches
fallback_mode: range
