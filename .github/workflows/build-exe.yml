name: Build Windows EXE

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --onefile --windowed --name StockScanner --icon NONE scanner_gui.py

      - name: Upload EXE to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/StockScanner.exe
          body: |
            ## Stock Scanner Bot — Windows Desktop App

            ### Download
            👉 Click **StockScanner.exe** below to download

            ### How to use
            1. Make sure **TWS or IB Gateway** is running and API connections are enabled
            2. Place your **watchlist.csv** somewhere on your PC
            3. Double-click **StockScanner.exe** — no Python required
            4. In the app:
               - Set the correct **Port** (IB Gateway live = 4001, TWS live = 7496)
               - Browse to your **watchlist file**
               - Choose an **output folder** for results
               - Click **▶ Run Scan**
            5. Results (CSV + Excel) are saved in your output folder

            > Settings (port, folder, etc.) are remembered between runs.
